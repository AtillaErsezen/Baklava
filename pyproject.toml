[project]
name = "baklava"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "lightgbm>=4.7.0",
    "openai>=3.19.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "xgboost>=3.4.1",
]

[project.optional-dependencies]
# LLM Factory training (llm_train.py). Not needed for --kaggle export. `uv sync --extra llm`
llm = [
    "torch",
    "transformers",
    "peft",
    "datasets",
    "librosa",
    "soundfile",
    "pillow",
    "sentencepiece",
    "protobuf",
]
